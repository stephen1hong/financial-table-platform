name: Offline release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.lock
      - run: python -m pip install -r requirements/build.lock -r requirements/release.lock
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/sec_filing_downloader-0.1.0-py3-none-any.whl
      - run: python -c "from importlib.resources import files; assert files('sec_downloader').joinpath('templates/review.html').is_file(); import sec_downloader.review_app"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q -o pythonpath= -p no:cacheprovider
      - run: python scripts/offline_demo.py
      - run: python -m sec_downloader.review_app --help
      - run: python scripts/check_freeze.py
